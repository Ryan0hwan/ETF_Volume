name: ETF Volume Monitor

on:
  schedule:
    # 장중 2시간 간격 하루 4회 (UTC 14:35, 16:35, 18:35, 20:35) = 한국 23:35 / 01:35 / 03:35 / 05:35
    # 서머타임(3~11월): 뉴욕 10:35 / 12:35 / 14:35 / 16:35(마감 직후)
    # 서머타임 해제(11~3월): 뉴욕 09:35 / 11:35 / 13:35 / 15:35
    - cron: "35 14,16,18,20 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "장 시간이 아니어도 실행 (최근 거래일 기준, 중복 방지 없음)"
        type: boolean
        default: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 오늘 이미 보낸 알림 기록을 다음 실행으로 넘김
      - uses: actions/cache@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - run: python etf_volume.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE: ${{ inputs.force && '1' || '0' }}
